name: LiberTurkX Auto Tweet

on:
  schedule:
    # 3 saatte bir (UTC) — Gemini ücretsiz kotasını (20 istek/gün) korur
    - cron: '0 */3 * * *'
  workflow_dispatch: # Manuel tetikleme için

concurrency:
  group: liberturkx-tweet
  cancel-in-progress: false

jobs:
  tweet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py

      - name: Commit feed and history
        # Bot hata verse de o ana kadar filtrelenenler kaydedilsin;
        # aksi hâlde aynı haberler sonraki turda yeniden Gemini kotası yakar.
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add history.json feed_items.json feed.xml
          git diff --staged --quiet || git commit -m "Update feed and history"
          git pull --rebase origin main || true
          git push
